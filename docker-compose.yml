version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=factory_admin
      - POSTGRES_PASSWORD=factory_pass
      - POSTGRES_DB=factory_db
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: factory_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://factory_admin:factory_pass@db/factory_db
    depends_on:
      - db

  # --- [新增] 前端服务 ---
  frontend:
    build: ./frontend
    container_name: factory_frontend
    ports:
      - "3000:3000" # 员工访问 localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules # 避免本地 node_modules 冲突
    environment:
      - VITE_API_URL=http://localhost:8000 # 告诉前端后端在哪里
    depends_on:
      - backend

volumes:
  postgres_data: